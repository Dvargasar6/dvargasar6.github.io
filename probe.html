<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Curriculum Matrix</title>
  <style>
    .grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr); /* adjust to your max columns */
      gap: 50px;
      max-width: 1500px;
      margin: 0 auto;
    }
    .folder-button {
      display: inline-block;
      width: 75px;
      height: 50px;
      background-color: #f1c40f;
      border-radius: 0 5px 5px 5px;
      border: 2px solid black;
      position: relative;
      text-align: center;
      text-decoration: none;
      color: #2c3e50;
      font-weight: bold;
      padding-top: 40px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }
    .folder-button::before {
      content: "";
      position: absolute;
      border: 2px solid black;
      top: -20px;
      left: 0;
      width: 60px;
      height: 20px;
      background-color: #f1c40f;
      border-radius: 5px 5px 0 0;
    }
    .folder-button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>Curriculum Matrix</h1>
  <div id="grid" class="grid"></div>
  <script>
  const grid = document.getElementById("grid");

  fetch("http://localhost:4000/matrix")
    .then(res => res.json())
    .then(rows => {
      console.log("Rows from backend:", rows); // debug
      rows.forEach(row => {
        row.forEach(cell => {
          if (cell && cell.toString().trim() !== "") {
            const a = document.createElement("a");
            a.href = `subjects/${cell}/index.html`;
            a.className = "folder-button";
            a.textContent = cell;
            grid.appendChild(a);
          }
          else { 
            const empty = document.createElement("div"); 
            empty.className = "empty"; 
            grid.appendChild(empty);
          }
        });
      });
    });
</script>

</body>
</html>
