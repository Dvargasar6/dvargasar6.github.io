<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Curriculum Matrix</title>
  <style>
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* adjust to your max columns */
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    .folder-button {
      display: inline-block;
      width: 150px;
      height: 100px;
      background-color: #f1c40f;
      border-radius: 5px;
      position: relative;
      text-align: center;
      text-decoration: none;
      color: #2c3e50;
      font-weight: bold;
      padding-top: 40px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }
    .folder-button::before {
      content: "";
      position: absolute;
      top: -20px;
      left: 0;
      width: 60px;
      height: 20px;
      background-color: #f1c40f;
      border-radius: 5px 5px 0 0;
    }
    .folder-button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>Curriculum Matrix</h1>
  <div id="grid" class="grid"></div>

  <script>
    // Example CSV data (you can load via fetch if stored as subjects.csv)
    const csvData = `Math,Physics,
Python,,Web
Literature,History,Biology`;

    // Parse CSV into rows
    const rows = csvData.trim().split("\n").map(r => r.split(","));

    const grid = document.getElementById("grid");

    rows.forEach(row => {
      row.forEach(cell => {
        if (cell.trim() !== "") {
          const a = document.createElement("a");
          a.href = `subjects/${cell}/index.html`; // link to folder
          a.className = "folder-button";
          a.textContent = cell;
          grid.appendChild(a);
        }
      });
    });
  </script>
</body>
</html>
